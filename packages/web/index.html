<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!-- Theme is applied before first paint so a stored dark preference never flashes light. -->
		<script>
			(() => {
				try {
					if (localStorage.getItem("redeem-theme") === "dark") document.documentElement.classList.add("dark");
				} catch {}
			})();
		</script>
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#f4f4ee" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0d1210" media="(prefers-color-scheme: dark)" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Redeem — the record layer for Robinhood Stock Tokens" />
		<meta
			property="og:description"
			content="A verifiable record of Stock Token share-equivalents, holder intent and redemption demand on Robinhood Chain — before shareholder rights come onchain."
		/>
		<meta property="og:image" content="/redeem/art/og.jpg" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="/redeem/art/og.jpg" />
		<meta
			name="description"
			content="Redeem maintains a verifiable record of Robinhood Stock Token share-equivalents, holder intent and redemption demand on Robinhood Chain — before shareholder rights come onchain. Independent infrastructure, not affiliated with Robinhood."
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap"
			rel="stylesheet"
		/>
		<title>Redeem — the record layer for Robinhood Stock Tokens</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/web/main.tsx"></script>
	</body>
</html>
